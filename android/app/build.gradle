plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hieroocr.app'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.hieroocr.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-21', '-j' + Runtime.runtime.availableProcessors()
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sin claves propias se firma con la de depuración para poder instalarla.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    // El modelo ya está comprimido a su manera y la fuente es pequeña: sin compresión, más rápido.
    androidResources {
        noCompress 'hmod', 'ttf'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
