plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hieroocr.app'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.hieroocr.app'
        minSdk 24
        targetSdk 36
        // Google Play exige que cada subida tenga un versionCode mayor: en CI se usa
        // el número de ejecución (VERSION_CODE); a mano, el valor por defecto.
        versionCode((System.getenv('VERSION_CODE') ?: '2') as int)
        versionName '1.1'
        externalNativeBuild {
            ndkBuild {
                // páginas de 16 KB: obligatorio en Google Play para apps con código nativo
                arguments 'APP_PLATFORM=android-24', 'APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true', '-j' + Runtime.runtime.availableProcessors()
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    // Clave de subida a Google Play: se lee del entorno (en GitHub Actions, de los
    // secretos ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS). Sin ella, el
    // APK de release se firma con la clave de depuración para poder instalarlo.
    def ks = System.getenv('ANDROID_KEYSTORE_FILE')
    def conClave = ks && file(ks).exists()
    signingConfigs {
        if (conClave) {
            subida {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'hieroocr'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = conClave ? signingConfigs.subida : signingConfigs.debug
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'   // símbolos nativos para los informes de fallos de Play
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    // El modelo ya está comprimido a su manera y la fuente es pequeña: sin compresión, más rápido.
    androidResources {
        noCompress 'hmod', 'ttf'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
