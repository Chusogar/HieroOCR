name: Android

on:
  push:
    branches: [main, android]
    paths: ['src/**', 'android/**', 'datos/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['src/**', 'android/**', 'datos/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    name: Compilar el APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar (SDL2, SDL2_image, SDL2_ttf, datos)
        run: sh android/preparar.sh
      - name: Compilar
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Renombrar
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/HieroOCR.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/HieroOCR-depuracion.apk
          ls -la apk
      - uses: actions/upload-artifact@v4
        with:
          name: HieroOCR-apk
          path: apk/*.apk

  emulador:
    name: Probar en un emulador
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HieroOCR-apk
          path: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir un PDF y una foto, seleccionar un signo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: sh android/pruebas/emulador.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-emulador
          path: capturas/
